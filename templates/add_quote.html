{% extends "base.html" %}
{% block title %}Add Quote{% endblock %}

{% block content %}
<div class="page-container">
    <h1>Add a Quote</h1>
    <form method="POST" class="quote-form">
        <label for="text">Quote</label>
        <textarea id="text" name="text" rows="4" placeholder="Enter the quote..." required></textarea>

        <label for="author">Author</label>
        <input id="author" name="author" type="text" placeholder="Author name" required>

        <button type="submit" class="btn-submit">Add Quote</button>
    </form>
</div>
{% endblock %}
