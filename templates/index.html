{% extends "base.html" %}
{% block title %}Quote of the Day{% endblock %}

{% block content %}
<div class="slideshow">
    <div class="slide active"
        style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600')"></div>
    <div class="slide"
        style="background-image: url('https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600')"></div>
    <div class="slide"
        style="background-image: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600')"></div>
    <div class="slide"
        style="background-image: url('https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?w=1600')"></div>
    <div class="slide"
        style="background-image: url('https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600')"></div>
</div>
<div class="overlay"></div>

<div class="hero-container">
    <h1>Quote of the Day</h1>
    <p class="date">{{ today }}</p>
    <div class="card">
        <p class="quote">"{{ quote.text }}"</p>
        <p class="author">— {{ quote.author }}</p>
    </div>
    <div class="dots" id="dots"></div>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
{% endblock %}
